[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ivi-assistant"
version = "0.2.0"
description = "Assistente pessoal local em português, com voz, memória e interface reativa."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "websockets>=13,<17",
  "psutil>=6,<8",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
voice = ["faster-whisper==1.2.1", "piper-tts==1.8.0"]
llm = ["llama-cpp-python==0.3.36"]
models = ["huggingface-hub>=0.27,<2"]
test = ["httpx>=0.27,<1"]

[project.scripts]
ivi = "ivi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ivi = ["static/*"]
